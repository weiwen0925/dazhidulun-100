<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:100px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;margin:0;padding:0;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{background:var(--bg);color:var(--text);font-size:20px;
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;}

/* 側欄 */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);
  color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-head{position:sticky;top:0;width:100%;background:var(--sbBg);z-index:5;
  padding:14px 6px 12px;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand{display:block;text-align:center;text-decoration:none;cursor:pointer;
  line-height:1.5;transition:color .25s;margin-bottom:8px;}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .l1{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  letter-spacing:1.5px;color:var(--gold);opacity:.82;}
.sb-brand .l2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;
  color:var(--goldL);margin-top:2px;}
.sb-quick{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:6px;}
.sb-qbtn{display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;
  color:var(--goldL);text-decoration:none;border:1px solid rgba(184,134,11,.5);
  border-radius:12px;padding:3px 12px;background:rgba(184,134,11,.12);
  letter-spacing:1px;transition:background .2s;}
.sb-qbtn:hover{background:rgba(184,134,11,.28);}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:4px;
  width:100%;padding:10px 0 0;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 4px;width:100%;text-decoration:none;color:var(--sbText);
  cursor:pointer;border-radius:8px;transition:background .2s;}
.sb-item:hover{background:rgba(184,134,11,.16);}
.sb-item.active{background:rgba(184,134,11,.28);
  box-shadow:0 0 12px rgba(184,134,11,.35);}
.sb-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:"Noto Sans TC",sans-serif;font-size:17.5px;
  font-weight:600;border:1.5px solid var(--gold);color:var(--goldL);}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;}
.sb-label{font-size:12.5px;letter-spacing:.3px;opacity:.86;text-align:center;
  font-family:"Noto Sans TC",sans-serif;line-height:1.3;}

/* tooltip */
#sbTip{position:fixed;z-index:200;max-width:280px;background:rgba(30,26,20,.97);
  color:#f0e6d2;border:1px solid rgba(184,134,11,.5);border-radius:10px;
  padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;
  pointer-events:none;transition:opacity .2s;font-family:"Noto Sans TC",sans-serif;}
#sbTip.show{opacity:1;}
#sbTip .tip-name{font-size:15px;font-weight:700;color:var(--goldL);margin-bottom:6px;}
#sbTip .tip-desc{font-size:13px;line-height:1.7;color:#d8cdb6;}

/* main */
.main{margin-left:var(--sbW);}
@media(max-width:900px){.main{margin-left:0;} #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);} #sbToggle{display:flex!important;}}

/* hero */
.site-hero{position:relative;background:var(--headGrad);color:#f4ecd8;
  text-align:center;padding:72px 24px 60px;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;font-size:300px;font-weight:900;
  color:rgba(212,168,75,.04);top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;white-space:nowrap;}
.site-hero>*{position:relative;z-index:1;}
.hero-title{font-size:56px;font-weight:900;color:var(--goldL);letter-spacing:4px;margin:0 0 14px;}
.hero-subtitle{font-size:20px;color:#e8dcc0;letter-spacing:2px;margin-bottom:18px;}
.hero-meta{font-size:18px;color:#c9b896;letter-spacing:1px;margin-bottom:8px;}
.hero-range{font-size:17px;color:#b8a888;letter-spacing:1px;
  border-top:1px solid rgba(184,134,11,.3);display:inline-block;padding-top:14px;margin-top:8px;}

/* preface */
.preface{max-width:880px;margin:42px auto;padding:0 28px;}
.preface-title{font-size:30px;color:var(--accent);text-align:center;margin-bottom:24px;
  font-weight:700;letter-spacing:2px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 18px;text-align:justify;}

/* 總目錄 */
.toc-section{max-width:1100px;margin:48px auto;padding:0 28px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;font-weight:700;
  letter-spacing:3px;margin-bottom:10px;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;margin-bottom:28px;
  font-family:"Noto Sans TC",sans-serif;letter-spacing:1px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.toc-card{display:flex;align-items:center;gap:16px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:18px 22px;
  text-decoration:none;color:var(--text);box-shadow:0 1px 4px rgba(91,58,41,.07);
  transition:transform .2s,box-shadow .2s;cursor:pointer;}
.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(91,58,41,.14);}
.toc-num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;
  font-weight:700;font-family:"Noto Sans TC",sans-serif;}
.toc-name{font-size:19.5px;line-height:1.7;font-weight:600;color:var(--accent);}
.toc-card .toc-sub{font-size:14.5px;color:var(--text-muted);margin-top:4px;
  font-family:"Noto Sans TC",sans-serif;}

/* chapter */
.chapter{margin:24px 0;}
.ch-head{background:var(--headGrad);color:#f4ecd8;text-align:center;
  padding:44px 24px 38px;position:relative;}
.ch-head::after{content:"";display:block;width:80px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0;}
.ch-pin{font-family:"Noto Sans TC",sans-serif;font-size:15px;letter-spacing:3px;
  color:var(--goldL);opacity:.9;margin-bottom:10px;}
.ch-name{font-size:34px;font-weight:900;color:#f0e4c8;letter-spacing:2px;}
.ch-sub{font-size:17px;color:#c9b896;margin-top:12px;letter-spacing:1px;
  font-family:"Noto Sans TC",sans-serif;}
.ch-body{max-width:1000px;margin:0 auto;padding:30px 22px 10px;}

/* bridge */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}

/* iframe */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);
  margin:0 0 8px;min-height:180px;}
.next-link{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:var(--accent);text-decoration:none;border:1px solid var(--gold);border-radius:20px;
  padding:8px 22px;margin:8px 0 4px;transition:background .2s;}
.next-link:hover{background:var(--gold);color:#fff;}

/* footer */
.site-footer{background:var(--headGrad);color:#e8dcc0;text-align:center;
  padding:48px 24px;margin-top:40px;}
.ft-title{font-size:24px;color:var(--goldL);font-weight:700;letter-spacing:3px;margin-bottom:16px;}
.site-footer p{font-size:17px;line-height:2;color:#c9b896;letter-spacing:1px;}

/* progress capsule */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;
  background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:130;width:44px;height:44px;
  border-radius:8px;background:var(--sbBg);color:var(--goldL);border:1px solid var(--gold);
  font-size:20px;align-items:center;justify-content:center;cursor:pointer;}
#backTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
  background:var(--gold);color:#fff;border:0;font-size:20px;cursor:pointer;display:none;
  z-index:120;box-shadow:0 3px 12px rgba(0,0,0,.25);}
#backTop.show{display:flex;align-items:center;justify-content:center;}

@media(max-width:600px){
  body{font-size:18px;} .hero-title{font-size:40px;} .ch-name{font-size:26px;}
  .toc-grid{grid-template-columns:1fr;}
}

(function(){
  'use strict';
  var ALLOWED_HOST = 'weiwen0925.github.io';
  var ALLOWED_PATH = '/dazhidulun-100/';

  function silentLockdown(reason){
    try{
      /* secure-by-default：不加 .wy-revealed，preguard CSS 持續隱藏整頁（純白）。
         同時持續清空 body：解析器邊 append 內容、observer 邊清，確保無內容殘留。 */
      var clear = function(){
        try{
          var ifr = document.querySelectorAll('iframe');
          for(var i=0;i<ifr.length;i++){
            try{ ifr[i].removeAttribute('srcdoc'); ifr[i].remove(); }catch(e){}
          }
          if(document.body){
            if(document.body.childNodes.length){ document.body.innerHTML = ''; }
            document.body.style.cssText = 'background:#fff;margin:0;padding:0;';
          }
        }catch(e){}
      };
      clear();
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', clear);
      }
      var startObs = function(){
        try{
          if(document.documentElement){
            new MutationObserver(clear).observe(document.documentElement,
              {childList:true, subtree:true});
          } else { setTimeout(startObs, 10); }
        }catch(e){}
      };

  try{
    var noop = function(){};

  }catch(e){ window.print = function(){}; }
  document.addEventListener('keydown', function(e){
    var k = (e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey) && (k==='p' || k==='s')){
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  window.addEventListener('beforeprint', function(e){
    e.preventDefault(); e.stopPropagation();
  }, true);

  /* B · webdriver / headless 偵測 */
  function isAutomated(){
    try{
      if(navigator.webdriver === true) return true;
      var ua = (navigator.userAgent||'') + '';
      if(/HeadlessChrome|PhantomJS|Selenium|Puppeteer|Playwright|bot|crawl|spider|slurp|GPTBot|ClaudeBot|anthropic|CCBot|Bytespider|Google-Extended|Googlebot|bingbot|Applebot|facebookexternalhit|Amazonbot|PerplexityBot|archive\.org|ia_archiver/i.test(ua)) return true;
    }catch(e){}
    return false;
  }
  if(isAutomated()){ silentLockdown('automated'); return; }

  /* L4 · Origin Lock */
  function originOK(){
    try{
      if(location.protocol !== 'https:' && location.protocol !== 'http:') return false;
      if(location.hostname.toLowerCase() !== ALLOWED_HOST.toLowerCase()) return false;
      var p = location.pathname || '/';
      if(p.indexOf(ALLOWED_PATH) !== 0) return false;
      return true;
    }catch(e){ return false; }
  }
  if(!originOK()){ silentLockdown('origin'); return; }

  /* L6 / L8 · 線上活性 HEAD ping */
  function freshnessCheck(){
    return new Promise(function(resolve, reject){
      try{
        var url = location.protocol + '//' + ALLOWED_HOST + ALLOWED_PATH +
                  '?_wyping=' + Date.now() + '.' + Math.floor(Math.random()*1e8);
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); reject(new Error('timeout')); }, 6000);
        fetch(url, {
          method: 'HEAD', cache: 'no-store', credentials: 'omit', mode: 'cors',
          signal: ctrl ? ctrl.signal : undefined
        }).then(function(r){
          clearTimeout(timer);
          if(r && (r.ok || r.type === 'opaque' || (r.status>=200 && r.status<400))) resolve();
          else reject(new Error('status:' + (r && r.status)));
        }).catch(function(err){ clearTimeout(timer); reject(err); });
      }catch(e){ reject(e); }
    });
  }

  freshnessCheck().then(function(){
    document.documentElement.classList.add('wy-revealed');

  window.__wyReady = new Promise(function(resolve){
    window.__wyReadyResolve = resolve;
  });

  try{
    var origExec = document.execCommand;
    document.execCommand = function(cmd){
      if((cmd||'').toLowerCase() === 'print') return false;
      return origExec.apply(document, arguments);
    };
  }catch(e){}

<button id="backTop">↑</button>
<script>
var sbBrand=document.getElementById('sbBrand');
if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
var sbToggle=document.getElementById('sbToggle'),sb=document.getElementById('sb');
if(sbToggle)sbToggle.addEventListener('click',function(){sb.classList.toggle('open');});
var backTop=document.getElementById('backTop');
if(backTop)backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
  if(backTop)backTop.classList.toggle('show',window.scrollY>600);
}
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();

/* iframe auto-height (viewport/content 解耦) */
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete'){tick();}
  else{f.addEventListener('load',tick);}
}
window.setupFrame=setupFrame;window.resizeAllFrames=resizeAllFrames;
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});

document.addEventListener('click',function(e){
  var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);var el=document.getElementById(id);if(!el)return;
  e.preventDefault();resizeAllFrames();
  setTimeout(function(){resizeAllFrames();
    var rect=el.getBoundingClientRect();var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});},60);
},true);

var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);

/* 側欄高亮 + tooltip */
var items=[].slice.call(document.querySelectorAll('.sb-item'));
function highlight(){
  var best=null;
  document.querySelectorAll('.chapter').forEach(function(sec){
    if(sec.getBoundingClientRect().top<window.innerHeight*0.35)best=sec.id;
  });
  items.forEach(function(it){
    it.classList.toggle('active',it.getAttribute('href')==='#'+best);
  });
}
window.addEventListener('scroll',highlight,{passive:true});highlight();

var tip=document.getElementById('sbTip');
items.forEach(function(it){
  it.addEventListener('mouseenter',function(){
    if(!tip)return;
    tip.querySelector('.tip-name').textContent=it.getAttribute('data-name')||'';
    tip.querySelector('.tip-desc').textContent=it.getAttribute('data-tip')||'';
    var r=it.getBoundingClientRect();
    tip.classList.add('show');
    var ty=Math.max(10,Math.min(window.innerHeight-tip.offsetHeight-10,r.top+r.height/2-tip.offsetHeight/2));
    tip.style.left=(r.right+10)+'px';tip.style.top=ty+'px';
  });
  it.addEventListener('mouseleave',function(){if(tip)tip.classList.remove('show');});
});
window.addEventListener('scroll',function(){if(tip)tip.classList.remove('show');},{passive:true});

/* 防複製外層 */
(function(){
  var blk=function(e){e.preventDefault();return false;};
